name: Bug report
description: Something does not work as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.
        Security issues must be reported privately, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal config (watches, subscriptions, sinks) and commands.
      placeholder: |
        1. angelia apply -f watches.yaml
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Angelia version
      description: Output of `angelia version`, or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Binary
        - Docker / Compose
        - Kubernetes (Helm)
        - Other
  - type: dropdown
    id: store
    attributes:
      label: Store
      options:
        - SQLite
        - Postgres
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens and secrets before pasting.
      render: shell
