name: Feature request
description: Suggest a new source, sink or capability.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas, consider starting a thread in Discussions first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like Angelia to behave.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Source (detection, e.g. a new registry)
        - Sink (delivery, e.g. a new target)
        - Event schema / spec
        - API / CLI / MCP
        - Deployment (Docker, Helm)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
